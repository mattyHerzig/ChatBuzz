<!-- In the root folder since that's where GitHub pages looks. Otherwise, it'd be in ./src/ -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Google's TTS endpoint 404s any request carrying an external Referer, and a media
         element has no per-element referrerPolicy, so this page-level policy is what makes
         Text-To-Speech work at all. Verified in-browser: with it audio loads, without it
         the <audio> element fails with code 4. -->
    <meta name="referrer" content="no-referrer">
    <title>ChatBuzz</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png">
    <link rel="manifest" href="./assets/favicon/site.webmanifest">
    <link rel="mask-icon" href="./assets/favicon/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="space"></div>
    <script src="./dist/bundle.js"></script>
</body>
</html>
